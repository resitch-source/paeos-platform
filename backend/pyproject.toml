[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paeos-fx"
version = "0.1.0"
description = "PAEOS-FX Foundation — horizontal platform framework for the Philippine Agriculture Enterprise Operating System"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "PAEOS" }]

dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "geoalchemy2>=0.14",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "python-multipart>=0.0.9",
    "email-validator>=2.1",
    "structlog>=24.1",
    "babel>=2.14",
]

[project.optional-dependencies]
jobs = ["celery>=5.3", "redis>=5.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "httpx>=0.27",
    "ruff>=0.3",
    "mypy>=1.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["paeos_fx*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "unit: pure-logic tests with no external dependencies",
    "integration: tests requiring a live PostgreSQL/PostGIS database",
    "tenant_isolation: negative tests proving cross-tenant isolation",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
plugins = []
