# PAEOS-FX local development stack (section AE).
# Non-production. Brings up PostgreSQL+PostGIS, Redis, the API, and a worker.
name: paeos-fx

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: paeos
      POSTGRES_PASSWORD: paeos
      POSTGRES_DB: paeos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paeos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      PAEOS_ENVIRONMENT: development
      PAEOS_DATABASE_URL: postgresql+psycopg://paeos:paeos@db:5432/paeos
      PAEOS_REDIS_URL: redis://redis:6379/0
      PAEOS_JWT_SECRET: dev-only-secret-change-me-0000000000000000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn paeos_fx.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      PAEOS_DATABASE_URL: postgresql+psycopg://paeos:paeos@db:5432/paeos
      PAEOS_REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "echo 'Worker scaffold ready. Celery app is wired via the jobs extra.' &&
             tail -f /dev/null"

volumes:
  pgdata:
