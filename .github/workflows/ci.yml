name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend lint / type / unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Mypy
        run: mypy paeos_fx
      - name: Unit tests
        run: pytest -m unit -q

  backend-integration:
    name: Backend integration + tenant isolation (PostGIS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: paeos
          POSTGRES_PASSWORD: paeos
          POSTGRES_DB: paeos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paeos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PAEOS_TEST_DATABASE_URL: postgresql+psycopg://paeos:paeos@localhost:5432/paeos
      PAEOS_DATABASE_URL: postgresql+psycopg://paeos:paeos@localhost:5432/paeos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Integration + tenant-isolation tests
        run: pytest -m "integration or tenant_isolation" -q

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: pip-audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install -e .
          pip-audit || true  # advisory in the foundation; hard-gated in Phase 12

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci || npm install
      - name: Type-check + build
        run: npm run build
