name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend lint / type / unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Mypy
        run: mypy paeos_fx
      - name: Unit tests
        run: pytest -m unit -q

  backend-integration:
    name: Backend integration + tenant isolation (PostGIS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: paeos
          POSTGRES_PASSWORD: paeos
          POSTGRES_DB: paeos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paeos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PAEOS_TEST_DATABASE_URL: postgresql+psycopg://paeos:paeos@localhost:5432/paeos
      PAEOS_DATABASE_URL: postgresql+psycopg://paeos:paeos@localhost:5432/paeos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Integration + tenant-isolation tests
        run: pytest -m "integration or tenant_isolation" -q

  backend-migrations:
    name: Migrations apply on real PostGIS (upgrade + round-trip)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: paeos
          POSTGRES_PASSWORD: paeos
          POSTGRES_DB: paeos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paeos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Alembic resolves the URL from application settings.
      PAEOS_DATABASE_URL: postgresql+psycopg://paeos:paeos@localhost:5432/paeos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # Guard against the Alembic version_num VARCHAR(32) limit: a revision id
      # longer than 32 chars makes `alembic upgrade` crash on the version write.
      - name: Revision ids fit alembic_version(32)
        run: |
          python - <<'PY'
          import pathlib, re, sys
          bad = []
          for f in pathlib.Path("migrations/versions").glob("*.py"):
              m = re.search(r'^revision = "([^"]+)"', f.read_text(), re.M)
              if m and len(m.group(1)) > 32:
                  bad.append((f.name, m.group(1), len(m.group(1))))
          if bad:
              print("Revision ids exceeding 32 chars:", bad)
              sys.exit(1)
          print("all revision ids <= 32 chars")
          PY
      - name: alembic upgrade head
        run: alembic upgrade head
      # Catch a silent no-commit regression: `alembic upgrade` can exit 0 while
      # rolling everything back, leaving an empty database. Assert tables exist.
      - name: Assert schema was actually created
        run: |
          python - <<'PY'
          import psycopg, sys
          from paeos_fx.core.config import get_settings
          url = get_settings().database_url.replace("postgresql+psycopg://", "postgresql://")
          with psycopg.connect(url) as c:
              n = c.execute("SELECT count(*) FROM information_schema.tables "
                            "WHERE table_schema='platform' AND table_type='BASE TABLE'").fetchone()[0]
              head = c.execute("SELECT version_num FROM platform.alembic_version").fetchone()[0]
          print(f"platform tables={n} head={head}")
          if n < 60:
              print("ERROR: migrations did not persist the expected schema"); sys.exit(1)
          PY
      - name: Round-trip downgrade base then upgrade head
        run: |
          alembic downgrade base
          alembic upgrade head

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: pip-audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install -e .
          pip-audit || true  # advisory in the foundation; hard-gated in Phase 12

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci || npm install
      - name: Type-check + build
        run: npm run build
